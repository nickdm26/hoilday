# Picks photos for new places and things to do, then saves js/photos.js.
# Runs by itself when js/data.js or js/photos.js changes, and fills any gaps.
# You can also run it from the Actions tab, and type place ids (or "all") in the box
# to pick those again from scratch. Photos picked by hand always stay.
name: Pick photos

on:
  push:
    paths:
      - "js/data.js"
      - "js/photos.js"
      - "js/photo-rank.js"
      - "tools/pick-photos.mjs"
      - ".github/workflows/photos.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Place ids to pick again, like: venice rome. Or all. Leave empty to only fill gaps."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: photos-${{ github.ref }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick photos
        env:
          REFRESH: ${{ inputs.refresh }}
        run: node tools/pick-photos.mjs --verbose

      - name: Save changes
        run: |
          git add js/photos.js
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pick photos for places"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
